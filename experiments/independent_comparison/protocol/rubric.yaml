schema_version: "1.0"
status: FROZEN
freeze_date: 2026-10-18
freeze_scope: formal_blind_judge_rubric_v1
scale:
  min: 0
  max: 5
  anchors:
    0: absent_or_unusable
    1: major_defects
    3: usable_with_material_gaps
    5: strong_and_well_supported
dimensions:
  factual_accuracy:
    weight: 0.25
    rule: verified_correct_claims_over_verifiable_claims
  key_fact_coverage:
    weight: 0.15
    rule: correctly_covered_frozen_ground_truth_claims_over_all_claims
  source_reliability:
    weight: 0.10
    rule: authority_and_source_content_match
  industry_logic:
    weight: 0.10
    rule: resource_to_chain_to_market reasoning
  historical_explanation:
    weight: 0.10
    rule: time_ordered phases and evidence-backed turning points
  causal_analysis:
    weight: 0.10
    rule: distinguishes evidence from hypothesis and alternative causes
  structure_completeness:
    weight: 0.05
    rule: required sections and scope clarity
  risk_analysis:
    weight: 0.10
    rule: concrete risks, indicators and uncertainty
  unsupported_inference:
    weight: -0.05
    rule: penalty for claims without matching evidence
judge_policy:
  minimum_independent_judges: 2
  adjudication_required_if_absolute_dimension_gap_at_least: 2
  judge_input_may_include: [anonymous_report, rubric, task_prompt]
  judge_input_must_not_include: [group_id, ground_truth_before_claim_scoring, other_reports, run_trace]
