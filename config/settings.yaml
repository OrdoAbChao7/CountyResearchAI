# ===========================================
# AI县域产业研究助手 - 主配置文件
# ===========================================
# 说明:
#   - 敏感信息(API Key)不在此处,统一放在 .env
#   - 本文件提供非敏感的默认行为配置
#   - config.py 会将本文件与 .env 合并,env 优先级更高
# ===========================================

app:
  name: "CountyResearchAI · Agentic Industrial Intelligence Platform"
  version: "0.2.0"
  # 报告文件命名模板(Jinja2)
  report_filename_template: "{{ county }}_{{ focus }}_{{ date }}.md"

# ---------- LLM 配置 ----------
llm:
  # provider/model/base_url/api_key 从 .env 读取
  temperature: 0.3          # 分析类任务偏低温度,保证稳定
  max_tokens: 4096
  timeout: 60               # 单次请求超时(秒)
  retry:
    max_attempts: 5
    backoff_seconds: 2      # 指数退避起始值
  # 分析任务拆分(每个子任务独立调用LLM,降低单次prompt长度)
  tasks:
    - industry_status       # 产业现状
    - advantages            # 优势分析
    - shortcomings          # 短板分析
    - recommendations       # 发展建议

# ---------- 搜索配置 ----------
search:
  # provider/api_key 从 .env 读取
  max_results: 10
  timeout: 30
  concurrency: 3            # 并发采集数
  retry:
    max_attempts: 3
    backoff_seconds: 2
  # 是否抓取搜索结果详情页(增加数据量但更慢)
  fetch_detail: true
  detail_max_chars: 8000    # 单页正文截断长度

# ---------- 存储配置 ----------
storage:
  # 留空则使用项目根目录下的 data/ 和 reports/
  data_dir: ""              # 覆盖 DATA_DIR
  reports_dir: ""           # 覆盖 REPORTS_DIR
  raw_subdir: "raw"         # data/raw/
  processed_subdir: "processed"  # data/processed/
  runs_subdir: "runs"       # data/runs/：运行记录、事件、检查点、报告
  # 原始数据归档格式:按 {县名}/{日期}/ 组织
  archive_layout: "{county}/{date}"

# ---------- 缓存配置 ----------
cache:
  enabled: true
  ttl_hours: 24             # 同一县+方向在此时间内复用数据
  # 缓存键 = hash(县名 + 方向 + 数据源)
  key_fields: ["county", "focus", "provider"]

# ---------- 运行时容错 ----------
runtime:
  # 单步失败是否抛错；默认降级继续（Agent 会标记 degraded）
  fail_fast: false

# ---------- Multi-Agent 预算 ----------
agents:
  max_steps: 6              # 单个 Agent 最大工具步数
  max_llm_calls: 6          # 单个 Agent 最大 LLM 调用次数
  max_specialists: 6        # 单轮最多并行专业 Agent 数
  max_rounds: 2             # Supervisor 反思补充研究最大轮数
  max_followup_queries: 4   # Critic 单轮最多补充检索词
  recursion_limit: 120
  agent_timeout_seconds: 300

# ---------- 知识图谱 ----------
graph:
  # memory: 无需外部服务；neo4j: 需安装 graph 可选依赖并配置连接
  backend: "memory"
  uri: "bolt://localhost:7687"
  user: "neo4j"
  database: "neo4j"
  connection_timeout: 10

# ---------- API ----------
api:
  host: "127.0.0.1"
  port: 8000
  cors_origins:
    - "http://localhost:5173"
  max_concurrent_runs: 2
  run_retention_days: 30

# ---------- Star B: 数字孪生 ----------
simulation:
  enabled: true
  engine: "baseline"        # mesa 为后续经校准引擎，当前明确不可用
  default_horizon_years: 5
  max_scenarios: 50

# ---------- Star C: 时序图谱 ----------
temporal:
  enabled: true
  default_as_of: ""

# ---------- 日志配置 ----------
logging:
  level: "INFO"             # DEBUG / INFO / WARNING / ERROR
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  # 日志文件(留空则仅输出到控制台)
  file: ""
  rotate: false
