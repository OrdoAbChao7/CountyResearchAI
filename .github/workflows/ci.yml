name: CI checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    name: Python lint, typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run lint checks
        run: ruff check src tests

      - name: Type-check core layers
        run: python -m mypy src/county_research_ai/domain src/county_research_ai/ports src/county_research_ai/application src/county_research_ai/modes src/county_research_ai/infrastructure src/county_research_ai/reporting

      - name: Run tests
        run: pytest --no-cov -q

  frontend:
    name: Frontend typecheck, unit tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build
