[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "county-research-ai"
version = "0.1.0"
description = "AI县域产业研究助手 - 自动化采集、分析与生成县域产业研究报告"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CountyResearchAI" }]
keywords = ["county", "industry", "research", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Researchers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# 运行时依赖
dependencies = [
    "openai>=1.30.0",          # LLM客户端(兼容DeepSeek/Qwen/OpenAI)
    "pydantic>=2.6.0",         # 数据模型校验
    "pyyaml>=6.0",             # 配置文件加载
    "httpx>=0.27.0",           # HTTP客户端(搜索API调用)
    "click>=8.1.0",            # CLI命令行框架
    "jinja2>=3.1.0",           # 提示词模板渲染
    "python-dotenv>=1.0.0",    # .env环境变量加载
    "tenacity>=8.2.0",         # 重试机制(网络请求容错)
    "beautifulsoup4>=4.12.0",  # HTML正文解析(政府页面抓取)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
county-research = "county_research_ai.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/CountyResearchAI"

# ===== setuptools 配置(src layout) =====
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
county_research_ai = ["py.typed"]

# ===== Ruff 配置(代码风格) =====
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
# Pipeline and renderer methods currently preserve one explicit, test-covered audit trail.
# Keep the threshold visible in CI; split a path only when it can be covered as independent behavior.
max-complexity = 18

# ===== pytest 配置 =====
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=county_research_ai",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "integration: 集成测试(需要真实API,默认跳过)",
    "slow: 较慢的测试",
]

# ===== mypy 配置 =====
[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
