[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "county-research-ai"
version = "0.2.0"
description = "Agentic Industrial Intelligence Platform for Chinese county industry research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CountyResearchAI" }]
keywords = ["county", "industry", "research", "llm", "multi-agent", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Researchers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# 运行时依赖
dependencies = [
    "openai>=1.30.0",          # LLM客户端(兼容DeepSeek/Qwen/OpenAI)
    "pydantic>=2.6.0",         # 数据模型校验
    "pyyaml>=6.0",             # 配置文件加载
    "httpx>=0.27.0",           # HTTP客户端(搜索API调用)
    "click>=8.1.0",            # CLI命令行框架
    "jinja2>=3.1.0",           # 提示词模板渲染
    "python-dotenv>=1.0.0",    # .env环境变量加载
    "tenacity>=8.2.0",         # 重试机制(网络请求容错)
    "beautifulsoup4>=4.12.0",  # HTML正文解析(政府页面抓取)
    "pypdf>=4.2.0",            # PDF正文解析(统计公报/认定公告附件)
    "fastapi>=0.115,<1",       # 本地 API
    "uvicorn>=0.30,<1",        # ASGI 服务器
    "langgraph>=1.0.0",              # Multi-Agent 编排
    "langgraph-checkpoint-sqlite>=3.0.0",  # 研究运行检查点
]

[project.optional-dependencies]
graph = [
    "neo4j>=5.20.0",               # Neo4j 图存储适配器
    "neo4j-graphrag>=1.0.0",       # 预留：GraphRAG 高级检索
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/your-org/CountyResearchAI"

# ===== setuptools 配置(src layout) =====
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
county_research_ai = ["py.typed", "reporting/templates/*.j2"]

# ===== Ruff 配置(代码风格) =====
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的依赖注入惯例：Depends 必须出现在参数默认值中。
"src/county_research_ai/api/routes/*.py" = ["B008"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
    "PLW2901", # 循环变量不得在循环体内被覆盖
]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 22

# ===== pytest 配置 =====
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--cov=county_research_ai",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "integration: 集成测试(需要真实API,默认跳过)",
    "slow: 较慢的测试",
]

# ===== mypy 配置 =====
[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
